x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: antecedengue-app:latest
  restart: unless-stopped

x-db-url: &db-url postgresql://${POSTGRES_USER:-antecedengue}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-antecedengue}

x-airflow: &airflow
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: antecedengue-airflow:latest
  restart: unless-stopped
  profiles: ["airflow"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Recife
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-}
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-antecedengue}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    POSTGRES_USER: ${POSTGRES_USER:-antecedengue}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-antecedengue}
    DATABASE_URL: *db-url
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./dags:/opt/airflow/project/dags:ro
    - ./src:/opt/airflow/project/src:ro
    - ./scripts:/opt/airflow/project/scripts:ro
    - ./config:/opt/airflow/project/config:ro
    - ./tests:/opt/airflow/project/tests:ro
    - ./data:/opt/airflow/project/data
    - ./models:/opt/airflow/project/models:ro
    - airflow-reports:/opt/airflow/project/reports
    - airflow-logs:/opt/airflow/logs
    - ./docker/airflow_init.py:/opt/airflow/airflow_init.py:ro
  networks: [dados]

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 -i healthcheck >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [dados]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antecedengue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-antecedengue}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [dados]
    restart: unless-stopped

  mlflow:
    <<: *app
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "*"
      --workers 1
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [dados]

  ingestor:
    <<: *app
    command: ["python", "-m", "src.ingest_mqtt"]
    environment:
      DATABASE_URL: *db-url
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'ingest_mqtt' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [dados]

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: *db-url
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_CORS_ORIGINS: http://localhost:${DASHBOARD_HOST_PORT:-8501},http://127.0.0.1:${DASHBOARD_HOST_PORT:-8501}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [dados, web]

  dashboard:
    <<: *app
    command: ["streamlit", "run", "app/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
      API_PUBLIC_URL: http://localhost:${API_HOST_PORT:-8000}
      SENSOR_FONTE: ${SENSOR_FONTE:-open-meteo}
      DASHBOARD_AUTH: ${DASHBOARD_AUTH:-on}
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [web]

  sensor-sim:
    <<: *app
    profiles: ["demo"]
    command: ["python", "scripts/sim_publisher.py", "--host", "mosquitto", "--source", "api", "--backfill-dias", "80",
              "--interval", "60"]
    depends_on:
      mosquitto:
        condition: service_healthy
      ingestor:
        condition: service_healthy
    networks: [dados]

  export-sensor:
    <<: *app
    profiles: ["export"]
    restart: "no"
    command: ["python", "-m", "src.export_sensor_csv"]
    environment:
      DATABASE_URL: *db-url
    volumes:
      - ./data/processed:/app/data/processed
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dados]

  seed-mlflow:
    <<: *app
    profiles: ["init"]
    restart: "no"
    command: ["python", "scripts/seed_mlflow.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [dados]

  trainer:
    <<: *app
    profiles: ["train"]
    restart: "no"
    command: ["sh", "-c", "python -m src.train --exp 01 && python -m src.train --exp 02 && python -m src.train --exp 03"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data/processed:/app/data/processed:ro
      - trainer-reports:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [dados]

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["python", "/opt/airflow/airflow_init.py"]
    environment:
      <<: *airflow-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow
    command: ["airflow", "webserver"]
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    <<: *airflow
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8974/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  dados:
  web:

volumes:
  mosquitto-data:
  postgres-data:
  mlflow-data:
  trainer-reports:
  airflow-logs:
  airflow-reports:
